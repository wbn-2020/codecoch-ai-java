x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-application-healthcheck: &application-healthcheck
  test:
    - CMD-SHELL
    - >-
      JAVA_TOOL_OPTIONS='' exec java -cp /opt/codecoachai/health-probe HealthProbe
      "$${HEALTHCHECK_URL}" "$${HEALTHCHECK_TIMEOUT_MILLIS}"
      "$${HEALTHCHECK_EXPECTED_STATUS}"
  interval: 15s
  timeout: 5s
  start_period: 90s
  retries: 3

# ============================================================
# CodeCoachAI V3 本地开发环境 docker-compose
# 默认仅启动基础设施：MySQL + Redis + Nacos
# 按需 profile：mq、mq-dashboard、search、vector、app-services、search-service
# app-services 启动 Gateway、Core、AI；search-service 启动 Search 及其依赖。
# 注意：该 compose 仅用于本机开发，端口默认绑定 127.0.0.1，不应直接用于公网或准生产。
# MySQL 首次只导入 V2 基线 init.sql；随后由一次性 flyway-migrate 服务执行 V3+ migration。
# 初始化仅在首次创建 mysql-data 时执行，使用前确认目标 volume 可丢弃。
# ============================================================

services:
  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: codecoachai-mysql
    logging: *default-logging
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required for local MySQL}
      MYSQL_DATABASE: codecoachai_v1
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Database migration ----------
  # init.sql represents the existing schema at Flyway baseline 2.999.
  # This one-shot job baselines a fresh schema and applies V3/V4 migrations exactly once.
  flyway-migrate:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: codecoachai-flyway-migrate
    logging: *default-logging
    working_dir: /workspace
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-codecoachai_v1}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required for Flyway}
      FLYWAY_URL: jdbc:mysql://${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-codecoachai_v1}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      FLYWAY_USER: ${MYSQL_USERNAME:-root}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required for Flyway}
      MAVEN_OPTS: "-Xms128m -Xmx384m"
    volumes:
      - ./:/workspace:ro
      - maven-cache:/root/.m2
    command:
      - mvn
      - -q
      - -f
      - /workspace/scripts/release/flyway-pom.xml
      - flyway:migrate
    restart: "no"

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: codecoachai-redis
    logging: *default-logging
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required for local Redis}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null)\" = PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- Nacos ----------
  nacos:
    image: nacos/nacos-server:v2.3.1
    container_name: codecoachai-nacos
    logging: *default-logging
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: ""
      JVM_XMS: 256m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-}
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Nacos configuration gate ----------
  # Existing remote configurations are never overwritten. For a disposable local
  # environment, set NACOS_CONFIG_BOOTSTRAP_ENABLED=true to publish only missing
  # checked-in profile configuration. Existing drift blocks application startup.
  # The current reviewed set contains common/redis/gateway/core/ai/search for dev.
  # A non-dev profile intentionally fails closed until all six matching files exist.
  nacos-config-init:
    image: python:3.12-alpine
    container_name: codecoachai-nacos-config-init
    profiles:
      - app-services
      - search-service
    logging: *default-logging
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      NACOS_NAMESPACE: "${NACOS_NAMESPACE:-}"
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      NACOS_ACCESS_TOKEN: ${NACOS_ACCESS_TOKEN:-}
      NACOS_CONFIG_BOOTSTRAP_ENABLED: ${NACOS_CONFIG_BOOTSTRAP_ENABLED:-true}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_CONFIG_SCHEME: ${NACOS_CONFIG_SCHEME:-http}
      NACOS_CONFIG_CONTEXT_PATH: ${NACOS_CONFIG_CONTEXT_PATH:-/nacos}
      NACOS_CONFIG_DIRECTORY: /config
      NACOS_CONFIG_AUDIT_DIRECTORY: /tmp/nacos-config-audit
    volumes:
      - ./docs/nacos:/config:ro
      - ./scripts/docker/nacos-config-init.sh:/scripts/nacos-config-init.sh:ro
      - ./scripts/nacos/nacos_config_guard.py:/scripts/nacos_config_guard.py:ro
    entrypoint: ["/bin/sh", "/scripts/nacos-config-init.sh"]
    restart: "no"

  # ---------- Gateway application ----------
  codecoachai-gateway:
    profiles:
      - app-services
    build:
      context: .
      target: runtime
      args:
        SERVICE: codecoachai-gateway
        SERVICE_PORT: 8080
    image: codecoachai/codecoachai-gateway:${CODECOACHAI_IMAGE_TAG:-local}
    container_name: codecoachai-gateway
    logging: *default-logging
    ports:
      - "127.0.0.1:${CODECOACHAI_GATEWAY_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: "${REDIS_PORT:-6379}"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required for Gateway}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_NAMESPACE: "${NACOS_NAMESPACE:-}"
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      CODECOACHAI_INTERNAL_OUTBOUND_SECRET: "${CODECOACHAI_GATEWAY_TO_CORE_SIGNING_SECRET:-}"
      CODECOACHAI_GATEWAY_TO_CORE_SIGNING_SECRET: "${CODECOACHAI_GATEWAY_TO_CORE_SIGNING_SECRET:-}"
      CODECOACHAI_GATEWAY_TO_AI_SIGNING_SECRET: "${CODECOACHAI_GATEWAY_TO_AI_SIGNING_SECRET:-}"
      CODECOACHAI_GATEWAY_TO_SEARCH_SIGNING_SECRET: "${CODECOACHAI_GATEWAY_TO_SEARCH_SIGNING_SECRET:-}"
      HEALTHCHECK_URL: http://127.0.0.1:8080/actuator/health
      HEALTHCHECK_TIMEOUT_MILLIS: ${CODECOACHAI_HEALTH_TIMEOUT_MILLIS:-3000}
      HEALTHCHECK_EXPECTED_STATUS: UP
      HEALTH_STARTUP_TIMEOUT_SECONDS: ${CODECOACHAI_GATEWAY_STARTUP_TIMEOUT_SECONDS:-180}
      HEALTH_MONITOR_INTERVAL_SECONDS: ${CODECOACHAI_HEALTH_INTERVAL_SECONDS:-10}
      HEALTH_MONITOR_FAILURE_THRESHOLD: ${CODECOACHAI_HEALTH_FAILURE_THRESHOLD:-6}
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
    healthcheck: *application-healthcheck
    restart: on-failure

  # ---------- Core application ----------
  codecoachai-core:
    profiles:
      - app-services
    build:
      context: .
      target: runtime
      args:
        SERVICE: codecoachai-core
        SERVICE_PORT: 9200
    image: codecoachai/codecoachai-core:${CODECOACHAI_IMAGE_TAG:-local}
    container_name: codecoachai-core
    logging: *default-logging
    ports:
      - "127.0.0.1:${CODECOACHAI_CORE_PORT:-9200}:9200"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "9200"
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-codecoachai_v1}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required for Core}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: "${REDIS_PORT:-6379}"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required for Core}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_NAMESPACE: "${NACOS_NAMESPACE:-}"
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      ROCKETMQ_NAME_SERVER: ${ROCKETMQ_NAME_SERVER:-rocketmq-namesrv:9876}
      CODECOACHAI_VECTOR_ENABLED: ${CODECOACHAI_VECTOR_ENABLED:-true}
      QDRANT_BASE_URL: "${QDRANT_BASE_URL:-}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-hangzhou.aliyuncs.com}
      OSS_BUCKET: "${OSS_BUCKET:-}"
      OSS_AK: "${OSS_AK:-}"
      OSS_SK: "${OSS_SK:-}"
      OSS_DOMAIN: ${OSS_DOMAIN:-}
      OSS_KEY_PREFIX: ${OSS_KEY_PREFIX:-dev}
      OSS_STS_ENDPOINT: ${OSS_STS_ENDPOINT:-sts.cn-hangzhou.aliyuncs.com}
      OSS_STS_REGION_ID: ${OSS_STS_REGION_ID:-cn-hangzhou}
      OSS_STS_ROLE_ARN: ${OSS_STS_ROLE_ARN:-}
      # Runtime image installs font-noto-cjk and exposes this stable symlink.
      RESUME_EXPORT_PDF_FONT_PATH: /opt/codecoachai/fonts/NotoSansCJK-Regular.ttc
      CODECOACHAI_TASK_CONSUMERS_ENABLED: ${CODECOACHAI_TASK_CONSUMERS_ENABLED:-false}
      CODECOACHAI_INTERNAL_OUTBOUND_SECRET: "${CODECOACHAI_CALLER_CORE_SIGNING_SECRET:-}"
      CODECOACHAI_GATEWAY_TO_CORE_SIGNING_SECRET: "${CODECOACHAI_GATEWAY_TO_CORE_SIGNING_SECRET:-}"
      CODECOACHAI_CALLER_AI_SIGNING_SECRET: "${CODECOACHAI_CALLER_AI_SIGNING_SECRET:-}"
      CODECOACHAI_CALLER_SEARCH_SIGNING_SECRET: "${CODECOACHAI_CALLER_SEARCH_SIGNING_SECRET:-}"
      HEALTHCHECK_URL: http://127.0.0.1:9200/actuator/health
      HEALTHCHECK_TIMEOUT_MILLIS: ${CODECOACHAI_HEALTH_TIMEOUT_MILLIS:-3000}
      HEALTHCHECK_EXPECTED_STATUS: UP
      HEALTH_STARTUP_TIMEOUT_SECONDS: ${CODECOACHAI_CORE_STARTUP_TIMEOUT_SECONDS:-240}
      HEALTH_MONITOR_INTERVAL_SECONDS: ${CODECOACHAI_HEALTH_INTERVAL_SECONDS:-10}
      HEALTH_MONITOR_FAILURE_THRESHOLD: ${CODECOACHAI_HEALTH_FAILURE_THRESHOLD:-6}
    depends_on:
      mysql:
        condition: service_healthy
      flyway-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
      rocketmq-broker:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck: *application-healthcheck
    restart: on-failure

  # ---------- AI application ----------
  codecoachai-ai:
    profiles:
      - app-services
    build:
      context: .
      target: runtime
      args:
        SERVICE: codecoachai-ai
        SERVICE_PORT: 9206
    image: codecoachai/codecoachai-ai:${CODECOACHAI_IMAGE_TAG:-local}
    container_name: codecoachai-ai
    logging: *default-logging
    ports:
      - "127.0.0.1:${CODECOACHAI_AI_PORT:-9206}:9206"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "9206"
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-codecoachai_v1}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required for AI}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: "${REDIS_PORT:-6379}"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required for AI}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_NAMESPACE: "${NACOS_NAMESPACE:-}"
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      ROCKETMQ_NAME_SERVER: ${ROCKETMQ_NAME_SERVER:-rocketmq-namesrv:9876}
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      CODECOACHAI_VECTOR_ENABLED: ${CODECOACHAI_VECTOR_ENABLED:-true}
      QDRANT_BASE_URL: "${QDRANT_BASE_URL:-}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      CODECOACHAI_AI_CRYPTO_SECRET_KEY: "${CODECOACHAI_AI_CRYPTO_SECRET_KEY:-}"
      CODECOACHAI_INTERNAL_OUTBOUND_SECRET: "${CODECOACHAI_CALLER_AI_SIGNING_SECRET:-}"
      CODECOACHAI_GATEWAY_TO_AI_SIGNING_SECRET: "${CODECOACHAI_GATEWAY_TO_AI_SIGNING_SECRET:-}"
      CODECOACHAI_CALLER_CORE_SIGNING_SECRET: "${CODECOACHAI_CALLER_CORE_SIGNING_SECRET:-}"
      HEALTHCHECK_URL: http://127.0.0.1:9206/actuator/health
      HEALTHCHECK_TIMEOUT_MILLIS: ${CODECOACHAI_HEALTH_TIMEOUT_MILLIS:-3000}
      HEALTHCHECK_EXPECTED_STATUS: UP
      HEALTH_STARTUP_TIMEOUT_SECONDS: ${CODECOACHAI_AI_STARTUP_TIMEOUT_SECONDS:-240}
      HEALTH_MONITOR_INTERVAL_SECONDS: ${CODECOACHAI_HEALTH_INTERVAL_SECONDS:-10}
      HEALTH_MONITOR_FAILURE_THRESHOLD: ${CODECOACHAI_HEALTH_FAILURE_THRESHOLD:-6}
    depends_on:
      mysql:
        condition: service_healthy
      flyway-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
      rocketmq-broker:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck: *application-healthcheck
    restart: on-failure

  # ---------- RocketMQ NameServer ----------
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: codecoachai-rocketmq-namesrv
    profiles:
      - mq
      - mq-dashboard
      - app-services
      - search-service
    logging: *default-logging
    ports:
      - "127.0.0.1:9876:9876"
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    restart: unless-stopped

  # ---------- RocketMQ Broker ----------
  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: codecoachai-rocketmq-broker
    profiles:
      - mq
      - app-services
      - search-service
    logging: *default-logging
    ports:
      - "127.0.0.1:10911:10911"
      - "127.0.0.1:10909:10909"
    depends_on:
      rocketmq-namesrv:
        condition: service_started
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
      NAMESRV_ADDR: rocketmq-namesrv:9876
    volumes:
      - rocketmq-store:/home/rocketmq/store
      - rocketmq-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      start_period: 30s
      retries: 12
    restart: unless-stopped

  # ---------- RocketMQ Dashboard（可选） ----------
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: codecoachai-rocketmq-dashboard
    profiles:
      - mq-dashboard
    logging: *default-logging
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"

  # ---------- Elasticsearch ----------
  elasticsearch:
    image: elasticsearch:8.14.3
    container_name: codecoachai-elasticsearch
    profiles:
      - search
      - search-service
    logging: *default-logging
    ports:
      - "127.0.0.1:${CODECOACHAI_ELASTICSEARCH_PORT:-9210}:9200"
      - "127.0.0.1:9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-codecoachai-local-elastic}
      ES_JAVA_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------- Search application ----------
  # The image entrypoint exits non-zero if Spring never becomes healthy. Combined
  # with on-failure restart, this avoids a false "Up" container after startup
  # failed while RocketMQ client threads remained alive.
  codecoachai-search:
    profiles:
      - search-service
    build:
      context: .
      target: runtime
      args:
        SERVICE: codecoachai-search
        SERVICE_PORT: 8091
    image: codecoachai/codecoachai-search:${CODECOACHAI_IMAGE_TAG:-local}
    container_name: codecoachai-search
    logging: *default-logging
    ports:
      - "127.0.0.1:${CODECOACHAI_SEARCH_PORT:-8091}:8091"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-codecoachai_v1}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required for Search}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: "${REDIS_PORT:-6379}"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required for Search}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_NAMESPACE: "${NACOS_NAMESPACE:-}"
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      ROCKETMQ_NAME_SERVER: ${ROCKETMQ_NAME_SERVER:-rocketmq-namesrv:9876}
      ELASTICSEARCH_URIS: ${ELASTICSEARCH_URIS:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      SPRING_ELASTICSEARCH_URIS: ${ELASTICSEARCH_URIS:-http://elasticsearch:9200}
      SPRING_ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      SPRING_ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-codecoachai-local-elastic}
      CODECOACHAI_ELASTICSEARCH_URIS: ${ELASTICSEARCH_URIS:-http://elasticsearch:9200}
      CODECOACHAI_ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      CODECOACHAI_ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-codecoachai-local-elastic}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-codecoachai-local-elastic}
      CODECOACHAI_INTERNAL_OUTBOUND_SECRET: "${CODECOACHAI_CALLER_SEARCH_SIGNING_SECRET:-}"
      CODECOACHAI_GATEWAY_TO_SEARCH_SIGNING_SECRET: "${CODECOACHAI_GATEWAY_TO_SEARCH_SIGNING_SECRET:-}"
      CODECOACHAI_VECTOR_ENABLED: "false"
      HEALTHCHECK_URL: http://127.0.0.1:8091/actuator/health
      HEALTHCHECK_TIMEOUT_MILLIS: ${CODECOACHAI_HEALTH_TIMEOUT_MILLIS:-3000}
      HEALTHCHECK_EXPECTED_STATUS: UP
      HEALTH_STARTUP_TIMEOUT_SECONDS: ${CODECOACHAI_SEARCH_STARTUP_TIMEOUT_SECONDS:-240}
      HEALTH_MONITOR_INTERVAL_SECONDS: ${CODECOACHAI_HEALTH_INTERVAL_SECONDS:-10}
      HEALTH_MONITOR_FAILURE_THRESHOLD: ${CODECOACHAI_HEALTH_FAILURE_THRESHOLD:-6}
    depends_on:
      mysql:
        condition: service_healthy
      flyway-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
      rocketmq-broker:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck: *application-healthcheck
    restart: on-failure

  # ---------- Qdrant ----------
  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: codecoachai-qdrant
    profiles:
      - vector
      - app-services
    logging: *default-logging
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-}"
    volumes:
      - qdrant-data:/qdrant/storage
    # The upstream image does not guarantee curl/wget. Do not declare a probe
    # that can fail solely because an HTTP client is absent from the image.

volumes:
  mysql-data:
  maven-cache:
  redis-data:
  nacos-data:
  rocketmq-store:
  rocketmq-logs:
  es-data:
  qdrant-data:
