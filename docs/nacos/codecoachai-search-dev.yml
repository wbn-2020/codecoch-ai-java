# ============================================================
# codecoachai-search service config
# Upload to Nacos: dataId=codecoachai-search-dev.yml group=DEFAULT_GROUP
# ============================================================

codecoachai:
  internal:
    auth:
      legacy-shared-secret: ""
      legacy-shared-secret-enabled: false
      legacy-shared-secret-callers: []
      caller-key-rings:
        codecoachai-gateway:
          secrets:
            - ${CODECOACHAI_GATEWAY_TO_SEARCH_SIGNING_SECRET}
          permissions: []
          forward-user-context: true
  search:
    refresh-interval: 1s
    default-page-size: 10
    fallback-to-record: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}
    username: elastic
    password: ${ELASTIC_PASSWORD}

spring:
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}
    username: elastic
    password: ${ELASTIC_PASSWORD}

rocketmq:
  consumer:
    group: codecoachai-search-consumer
