spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
          # Resume AI calls invoke a real model and can legitimately exceed the
          # default internal RPC budget. Keep the extended timeout scoped to
          # the long-running client instead of weakening all Feign calls.
          resumeAiFeignClient:
            connectTimeout: 3000
            readTimeout: 120000
          # Practice review invokes a real model synchronously. The default
          # five-second budget can expire after the model succeeds but before
          # question-service receives the response, leaving a false FAILED
          # practice record and an orphaned successful AI call log.
          aiPracticeFeignClient:
            connectTimeout: 3000
            readTimeout: 120000
          # Async task consumers synchronously ask resume-service to execute
          # JD parsing, resume optimization, and matching before acknowledging
          # the message. It must outlive the nested AI call above.
          taskResumeFeignClient:
            connectTimeout: 3000
            readTimeout: 120000
          # Task consumers call AI synchronously for interview reports and
          # generation jobs. Keep this budget scoped so normal RPC remains
          # responsive while a real model is still allowed to finish.
          taskAiFeignClient:
            connectTimeout: 3000
            readTimeout: 180000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

logging:
  file:
    path: ${CODECOACHAI_LOG_PATH:./logs/${spring.application.name:codecoachai-service}}
  level:
    root: INFO
    com.codecoachai: INFO
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
      total-size-cap: 1GB
      clean-history-on-start: false
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{64} - %msg%n"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true

springdoc:
  api-docs:
    enabled: true

codecoachai:
  internal:
    auth:
      enabled: true
      # The current service's outbound signing key. Every deployed service receives
      # a different value through CODECOACHAI_INTERNAL_OUTBOUND_SECRET.
      secret: ${CODECOACHAI_INTERNAL_OUTBOUND_SECRET:${CODECOACHAI_INTERNAL_SECRET}}
      # The former shared key is disabled in the four-service topology. Keep the
      # old Nacos data IDs for rollback instead of weakening the new receivers.
      legacy-shared-secret: ${CODECOACHAI_INTERNAL_LEGACY_SHARED_SECRET:}
      legacy-shared-secret-enabled: false
      legacy-shared-secret-callers: []
      # Each receiving service declares its own caller rings with exact endpoint
      # permissions and a separate user-context forwarding capability.
      allowed-clock-skew-seconds: 300
      nonce-ttl-seconds: 300
      max-signed-body-bytes: 1048576

  vector:
    enabled: ${CODECOACHAI_VECTOR_ENABLED:true}
    provider: qdrant
    base-url: ${QDRANT_BASE_URL}
    api-key: ${QDRANT_API_KEY}
    connect-timeout: 3s
    request-timeout: 15s
    default-limit: 10

  ops:
    health-services: ${CODECOACHAI_OPS_HEALTH_SERVICES:codecoachai-gateway|codecoachai-gateway|8080|gateway,codecoachai-core|codecoachai-core|9200|service,codecoachai-ai|codecoachai-ai|9206|service,codecoachai-search|codecoachai-search|8091|service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

rocketmq:
  name-server: rocketmq-namesrv:9876
  producer:
    group: codecoachai-producer
    send-message-timeout: 5000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2
