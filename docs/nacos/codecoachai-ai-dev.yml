server:
  port: 9206

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:codecoachai_v1}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

codecoachai:
  internal:
    auth:
      legacy-shared-secret: ""
      legacy-shared-secret-enabled: false
      legacy-shared-secret-callers: []
      caller-key-rings:
        codecoachai-gateway:
          secrets:
            - ${CODECOACHAI_GATEWAY_TO_AI_SIGNING_SECRET}
          permissions: []
          forward-user-context: true
        codecoachai-core:
          secrets:
            - ${CODECOACHAI_CALLER_CORE_SIGNING_SECRET}
          permissions:
            - GET /inner/agent/campaign-archive-sources/users/{userId}/campaigns/{campaignId}
            - GET /inner/agent/reminders/candidates
            - POST /inner/agent/job-coach/business-actions/complete
            - POST /inner/agent/job-coach/daily-plan/runs/{runId}/execute
            - POST /inner/agent/job-coach/daily-plan/runs/{runId}/fail
            - POST /inner/agent/knowledge/search
            - POST /inner/ai/application-event-reviews/generate
            - POST /inner/ai/embeddings
            - POST /inner/ai/interview/evaluate
            - POST /inner/ai/interview/evaluate/stream
            - POST /inner/ai/interview/follow-up
            - POST /inner/ai/interview/question
            - POST /inner/ai/interview/report
            - POST /inner/ai/interview-preparations/generate
            - POST /inner/ai/job-descriptions/parse
            - POST /inner/ai/learning-plans/generate
            - POST /inner/ai/practice/review
            - POST /inner/ai/question-recommendations/generate
            - POST /inner/ai/questions/generate
            - POST /inner/ai/resume/optimize
            - POST /inner/ai/resume/parse
            - POST /inner/ai/resume-job-match/analyze
            - POST /inner/ai/skill-gaps/analyze
            - POST /inner/ai/study-plans/generate-from-gap
          forward-user-context: true
  ai:
    enabled: true
    # Dev acceptance uses real DeepSeek calls. Set DEEPSEEK_API_KEY in env/private Nacos before startup.
    mock-enabled: false
    provider: openai-compatible
    model: ${AI_MODEL:deepseek-chat}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    temperature: 0.3
    max-tokens: 2048
    timeout-seconds: 60
    prompt-contract:
      # Flyway must publish a compatible ACTIVE managed prompt before the service accepts it.
      startup-check-enabled: true
      fail-fast: true
    router:
      default-provider: deepseek
      fallback-provider: dashscope
    providers:
      deepseek:
        base-url: ${AI_BASE_URL:https://api.deepseek.com}
        api-key: ${DEEPSEEK_API_KEY:}
        chat-model: ${AI_MODEL:deepseek-chat}
        reasoner-model: deepseek-reasoner
        temperature: 0.3
        max-tokens: 2048
        timeout-seconds: 60
      dashscope:
        base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${DASHSCOPE_API_KEY:}
        chat-model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
        reasoner-model: ${DASHSCOPE_REASONER_MODEL:qwen-max}
        temperature: 0.3
        max-tokens: 2048
        timeout-seconds: 60
    provider-security:
      # Exact host names only. Wildcards are rejected to prevent API key exfiltration.
      allowed-hosts:
        - api.deepseek.com
        - dashscope.aliyuncs.com
      allowed-ports:
        - 443
    crypto:
      # Required when saving AI model apiKey values from the admin UI.
      # Use at least 16 characters, or base64:<16/24/32-byte-key>.
      secret-key: ${CODECOACHAI_AI_CRYPTO_SECRET_KEY}
  v4:
    features:
      growth-enabled: true
      knowledge-enabled: true
      adaptive-plan-enabled: true
  v6:
    features:
      weekly-report-enabled: true
      weekly-report-ai-enabled: true
      weekly-report-plan-draft-enabled: false
  features:
    v7:
      external-plan-source: true
      campaign-review: true
    v9:
      evidence-learning: true
    v13:
      agent-skill-gap-context: true
    v8:
      campaign-cockpit: true
      campaign-pulse: true
      campaign-plan: true
      campaign-portfolio: true
      campaign-export: true
