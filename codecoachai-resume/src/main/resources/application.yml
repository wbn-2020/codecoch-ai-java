spring:
  application:
    name: codecoachai-resume
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:codecoachai-common-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:codecoachai-resume-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP
        file-extension: yml
codecoachai:
  resume:
    career-import:
      recovery:
        stale-after-minutes: ${CAREER_IMPORT_RECOVERY_STALE_AFTER_MINUTES:30}
        initial-delay: ${CAREER_IMPORT_RECOVERY_INITIAL_DELAY:15000}
        fixed-delay: ${CAREER_IMPORT_RECOVERY_FIXED_DELAY:60000}
    export:
      max-source-text-bytes: ${RESUME_EXPORT_MAX_SOURCE_TEXT_BYTES:524288}
      max-artifact-bytes: ${RESUME_EXPORT_MAX_ARTIFACT_BYTES:10485760}
      max-zip-entries: ${RESUME_EXPORT_MAX_ZIP_ENTRIES:12}
      # Upload admission concurrency and wait settings apply at resume service startup; restart is required after changes.
      max-concurrent-uploads: ${RESUME_EXPORT_MAX_CONCURRENT_UPLOADS:2}
      upload-acquire-timeout-millis: ${RESUME_EXPORT_UPLOAD_ACQUIRE_TIMEOUT_MILLIS:250}
      pdf-font-path: ${RESUME_EXPORT_PDF_FONT_PATH:}
    campaign-archive:
      max-entry-bytes: ${CAMPAIGN_ARCHIVE_MAX_ENTRY_BYTES:2097152}
      max-total-uncompressed-bytes: ${CAMPAIGN_ARCHIVE_MAX_TOTAL_UNCOMPRESSED_BYTES:8388608}
      max-archive-bytes: ${CAMPAIGN_ARCHIVE_MAX_BYTES:10485760}
      max-entries: ${CAMPAIGN_ARCHIVE_MAX_ENTRIES:15}
      max-rows-per-section: ${CAMPAIGN_ARCHIVE_MAX_ROWS_PER_SECTION:5000}
      max-error-message-chars: ${CAMPAIGN_ARCHIVE_MAX_ERROR_MESSAGE_CHARS:1000}
  features:
    v8:
      campaign-cockpit: ${CODECOACHAI_V8_CAMPAIGN_COCKPIT:false}
      campaign-pulse: ${CODECOACHAI_V8_CAMPAIGN_PULSE:false}
      campaign-plan: ${CODECOACHAI_V8_CAMPAIGN_PLAN:false}
      campaign-portfolio: ${CODECOACHAI_V8_CAMPAIGN_PORTFOLIO:false}
      campaign-export: ${CODECOACHAI_V8_CAMPAIGN_EXPORT:false}
    v9:
      evidence-usage: ${CODECOACHAI_V9_EVIDENCE_USAGE:false}
      evidence-feedback: ${CODECOACHAI_V9_EVIDENCE_FEEDBACK:false}
      evidence-assets-view: ${CODECOACHAI_V9_EVIDENCE_ASSETS_VIEW:false}
