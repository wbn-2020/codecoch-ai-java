server:
  port: 9204

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:codecoachai_v1}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

codecoachai:
  resume:
    export:
      # Upload admission concurrency and wait settings apply at resume service startup; restart is required after changes.
      max-concurrent-uploads: ${RESUME_EXPORT_MAX_CONCURRENT_UPLOADS:2}
      upload-acquire-timeout-millis: ${RESUME_EXPORT_UPLOAD_ACQUIRE_TIMEOUT_MILLIS:250}
    campaign-archive:
      max-entry-bytes: ${CAMPAIGN_ARCHIVE_MAX_ENTRY_BYTES:2097152}
      max-total-uncompressed-bytes: ${CAMPAIGN_ARCHIVE_MAX_TOTAL_UNCOMPRESSED_BYTES:8388608}
      max-archive-bytes: ${CAMPAIGN_ARCHIVE_MAX_BYTES:10485760}
      max-entries: ${CAMPAIGN_ARCHIVE_MAX_ENTRIES:13}
      max-rows-per-section: ${CAMPAIGN_ARCHIVE_MAX_ROWS_PER_SECTION:5000}
  features:
    v7:
      campaign-workspace: true
      real-interview: true
      offer: true
      contact-activity: true
      research: true
    v8:
      campaign-cockpit: false
      campaign-pulse: false
      campaign-plan: false
      campaign-portfolio: false
      campaign-export: false
